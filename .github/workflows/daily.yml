name: Publish daily word challenge
on:
  schedule:
    # After midnight New York time in both winter and summer.
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-wordle-daily
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: |
          node scripts/sync-daily.mjs
          npm run publish:daily
          npm run check
      - name: Commit dated edition
        id: edition
        run: |
          if git diff --quiet -- data/challenge-published.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/challenge-published.json
          git commit -m "Publish daily word challenge [skip ci]"
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Trigger production rebuild
        if: steps.edition.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOOK: ${{ secrets.WORDLE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::WORDLE_DEPLOY_HOOK is not configured; relying on the Git integration."
            exit 0
          fi
          curl --silent --show-error --fail --max-time 25 --proto '=https' -X POST -o /dev/null "$DEPLOY_HOOK"
